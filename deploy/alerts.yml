groups:
  - name: churn-analyzer
    rules:
      - alert: ChurnAnalyzerDown
        expr: up{job="churn-analyzer"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Анализатор оттока недоступен"
          description: "Prometheus не может снять /metrics больше двух минут."

      - alert: ChurnRecomputeStale
        expr: time() - churn_last_recompute_wallclock_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Оценки риска не обновлялись больше 15 минут"
          description: "Пересчёт по таймеру или после загрузки данных не выполнялся: проверьте лог бэкенда."

      - alert: ChurnHighRiskShare
        expr: churn_customers_by_risk_total{level="high"} / clamp_min(churn_customers_total, 1) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Больше половины клиентов в высоком риске"
          description: "{{ $value | humanizePercentage }} клиентов с высоким риском: нужна кампания удержания или пересмотр порогов."

      - alert: ChurnPotentialLossHigh
        expr: churn_potential_loss_cents > 1000000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ожидаемые потери за горизонт выше €10 000"
          description: "Сумма ожидаемых потерь: €{{ $value | humanize }} центов. Смотрите топ клиентов в панели."

      - alert: ChurnFeatureDominates
        expr: max by (feature) (churn_feature_expected_loss_cents) / clamp_min(churn_potential_loss_cents, 1) > 0.8
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Один признак объясняет больше 80% потерь"
          description: "Признак {{ $labels.feature }} доминирует в оценке: проверьте его вес в настройках модели."
